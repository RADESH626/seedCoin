appId: ${APP_ID}
---
# Añadir una Transacción de Ingreso Exitosamente
- launchApp
- tapOn: "Nueva Transacción" # O el ID / Texto principal
- assertVisible: "Ingreso"
- tapOn: "Ingreso" # Entrar a modo ingreso
- tapOn:
    id: "amount-input" # Ejemplo asumiendo IDs, o usar texto "0"
- inputText: "5000"
- tapOn:
    id: "submit-transaction" # O text "Guardar Ingreso"
- assertVisible: "5.000" # Se reflejó la interacción

---
# Validar Gasto sin Fondos Suficientes (Unhappy Path)
- launchApp
- tapOn: "Nueva Transacción"
- tapOn: "Gasto"
- tapOn:
    id: "amount-input"
- inputText: "99999999" # Monto absurdamente alto
- tapOn: "Vivienda" # Seleccionar categoría
- tapOn: "Guardar Gasto"
- assertVisible: "Saldo insuficiente" # Alerta esperada
- tapOn: "OK" # O cerrar alerta
